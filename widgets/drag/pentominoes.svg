<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:marker="http://knoxa.github.io/svg/marker"  onload="init(evt)"
viewBox="80 80 400 400" width="600" height="600" preserveAspectRatio="none" content-type="utf-8">

<script language="javascript" xlink:href="drag.js" />
<script language="javascript" xlink:href="../canvas/canvas.js" />

<defs>
  
  <path id="pentomino.F" d="M -15,-5 h10 v-10 h10 v10 h10 v20 h-10 v-10 h-20 z" />
  <path id="pentomino.I" d="M -25,-5 h50 v10 h-50 z" />
  <path id="pentomino.L" d="M -15,-5 h40 v10 h-30 v10 h-10 z" />
  <path id="pentomino.N" d="M -25,-5 h30 v10 h10 v10 h-20 v-10 h-20 z" />
  <path id="pentomino.P" d="M -5,5 h-10 v-10 h30 v20 h-20 z" />
  <path id="pentomino.T" d="M -5,-5 h-10 v-10 h30 v10 h-10 v20 h-10 z" />
  <path id="pentomino.U" d="M -5,5 v-10 h-10 v20 h30 v-20 h-10 v10 z" />
  <path id="pentomino.V" d="M -5,5 v-20 h-10 v30 h30 v-10 h-20 z" />
  <path id="pentomino.W" d="M 5,-5 h-10 v-10 h-10 v20 h10 v10 h20 v-10 h-10 z" />
  <path id="pentomino.X" d="M 5,-5 v-10 h-10 v10 h-10 v10 h10 v10 h10 v-10 h10 v-10 z" />
  <path id="pentomino.Y" d="M -5,-5 h-10 v-10 h10 v-10 h10 v40 h-10 z" />
  <path id="pentomino.Z" d="M -5,-5 h-10 v-10 h20 v20 h10 v10 h-20 z" />

  <g id="grid" style="stroke:black; stroke-width:1; fill:none">
    <path d="M0,0  h60"/>
    <path d="M0,10 h60"/>
    <path d="M0,20 h60"/>
    <path d="M0,30 h60"/>
    <path d="M0,40 h60"/>
    <path d="M0,50 h60"/>
    <path d="M0,60 h60"/>
    <path d="M0,70 h60"/>
    <path d="M0,80 h60"/>
    <path d="M0,90 h60"/>
    <path d="M0,100 h60"/>
    <path d="M0,0  v100"/>
    <path d="M10,0 v100"/>
    <path d="M20,0 v100"/>
    <path d="M30,0 v100"/>
    <path d="M40,0 v100"/>
    <path d="M50,0 v100"/>
    <path d="M60,0 v100"/>
  </g>
  
</defs>

<g style="fill:white; stroke:black; pointer-events:visible">
<marker:drag.background/>

<rect x="0" y="0" width="600" height="600" style="fill:white; stroke:red" />

<g style="fill:steelblue; stroke:white">

  <g transform="translate(105,105)">
    <use xlink:href="#grid" />
  </g>

  <g transform="translate(130,110)">
	<marker:drag.draggable/>
    <use xlink:href="#pentomino.I" />
  </g>

  <g id="gl" transform="translate(120,180), rotate(-90)">
	<marker:drag.draggable/>
    <use id="l" xlink:href="#pentomino.L" />
  </g>

  <g transform="translate(140,160), scale(-1,1), rotate(90)">
	<marker:drag.draggable/>
    <use xlink:href="#pentomino.F" />
  </g>
  
  <g transform="translate(160,160), scale(1,-1), rotate(90)">
	<marker:drag.draggable/>
    <use xlink:href="#pentomino.N" />
  </g>
  
  <g transform="translate(120,120), scale(-1,1)">
	<marker:drag.draggable/>
    <use xlink:href="#pentomino.P" />
  </g>

  <g transform="translate(150,120), rotate(90)">
	<marker:drag.draggable/>
    <use xlink:href="#pentomino.T" />
  </g>

  <g transform="translate(150,190)">
	<marker:drag.draggable/>
    <use xlink:href="#pentomino.U" />
  </g>

  <g transform="translate(120,190)">
	<marker:drag.draggable/>
    <use xlink:href="#pentomino.V" />
  </g>

  <g transform="translate(150,140), rotate(180)">
	<marker:drag.draggable/>
    <use xlink:href="#pentomino.W" />
  </g>

  <g transform="translate(130,140)">
	<marker:drag.draggable/>
    <use xlink:href="#pentomino.X" />
  </g>

  <g transform="translate(110,160),scale(-1,1)">
	<marker:drag.draggable/>
    <use xlink:href="#pentomino.Y" />
  </g>

  <g transform="translate(140,180), scale(1,-1), rotate(90)">
	<marker:drag.draggable/>
    <use xlink:href="#pentomino.Z" />
  </g>

</g>

</g>

<script>
<![CDATA[

function init(evt) {

  _Canvas_viewbox = new Canvas(evt);
  drag = new Drag();
  drag.dropCallback = snapToGrid;
}

function snapToGrid(draggable, target) {

  var p = getPosition(draggable);
  p.x = Math.round(p.x / 10) * 10;
  p.y = Math.round(p.y / 10) * 10;
  moveElementTo(draggable, p);
  console.log(p);
}

document.addEventListener("keypress", keypress);

function keypress(evt) {

	var target = drag.target;
	var key = evt.code;
	
	var list = drag.target.transform.baseVal;
	list.consolidate();
	
	var transform = drag.target.ownerSVGElement.createSVGTransform();
	
	if (key == "KeyQ") {
	    transform.setScale(1.0, -1.0);
  		list.appendItem(transform);
	}
	else if (key == "KeyA") {
	    transform.setScale(-1.0, 1.0);
  		list.appendItem(transform);
	}
	else if (key == "KeyZ") {
		transform.setRotate(90, 0, 0);
  		list.appendItem(transform);
	}
}
]]>
</script>

</svg>