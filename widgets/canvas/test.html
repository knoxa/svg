<html>
<head><title>SVG</title></head>
<body>
<div>
<?xml version = "1.0" standalone = "yes"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="600" height="450" viewBox="0 0 1200 900" onload="init(evt)">

<script language="text/ecmascript" xlink:href="canvas.js"/>

<script>
<![CDATA[

function init(evt) {

  canvas = new Canvas(evt);
  
  ggg = document.getElementById("fred");
}

function click(evt) {

  xy = canvas.getCoordinates(evt);
  console.log('1: ');
  console.log(xy);
  moveElementTo(document.getElementById("fred"), xy);
}

]]>
</script>

	<g onclick="click(evt)">
		<rect width="1200" height="900" style="fill:pink; stroke:none"/>
	</g>

	<g>
		<circle cx="100" cy="100" r="1" style="fill:none; stroke:black; pointer-events:none"/>
		<text x="110" y="110">100,100</text>
	</g>

	<g>
		<circle cx="500" cy="500" r="1" style="fill:none; stroke:black; pointer-events:none"/>
		<text x="510" y="510">500,500</text>
	</g>

	<g id="fred" transform="translate(800,800), rotate(45)">
		<circle r="20" style="fill:yellow; stroke:red"/>
		<path d="m0,0 v-40" style="stroke:black"/>
	</g>

</svg>
</div>
