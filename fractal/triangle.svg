<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="-80 -80 200 200"
	preserveAspectRatio="xMinYMin slice" width="800" height="800"
	xmlns="http://www.w3.org/2000/svg"
	xmlns:xlink="http://www.w3.org/1999/xlink">

	<defs>

		<path id="triangle" d="M0,-43.3 L-50,43.3 L50,43.3 Z"
			style="fill:none" />

	</defs>

	<g style="stroke:black; stroke-width:1">

		<use xlink:href="#triangle" />
		
		<g transform="scale(0.5,-0.5),translate(100,-43.3)">
