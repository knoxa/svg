<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="-1500 -1000 3000 2000" preserveAspectRatio="xMinYMin slice" xmlns="http://www.w3.org/2000/svg"  xmlns:xlink="http://www.w3.org/1999/xlink" >

<defs>

	<g id="markers">
		<path d="M0,0 L-50,0 L-50,50, L0,50 Z" style="fill:none; stroke:lightgrey; opacity:0.5"/>
		<!--
		<circle cx="0" cy="0" r="2" style="fill:black"/>
		 -->
	</g>
	
	<g id="x">
		<path d="M-50,25 h30 l-20,-20" style="stroke:purple; stroke-width:5; stroke-linecap:round"/>
		<use xlink:href="#markers" />
	</g>
	
	<g id="a" style="fill:white; stroke:lightgrey">
		<use xlink:href="#x" />
		<use xlink:href="#x" transform="rotate(90)"/>
		<use xlink:href="#x" transform="rotate(180)"/>
		<use xlink:href="#x" transform="rotate(270)"/>
	</g>
	
	<g id="b">
		<use xlink:href="#a" />
		<use xlink:href="#a" transform="translate(50,0),scale(-1,1), translate(-50,0)"/>
	</g>
	
	<pattern id="tile" patternContentUnits="userSpaceOnUse" patternUnits="userSpaceOnUse" width="200" height="200" viewBox="-50 -150 200 200">
		<use xlink:href="#b" />
		<use xlink:href="#b" transform="translate(0,-50),scale(1,-1),translate(0,50)"/>
	</pattern>
	
</defs>

<rect id="background" x="-1500" y="-1000" width="3000" height="2000" style="fill:url(#tile); stroke:none"/>

</svg>