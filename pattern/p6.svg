<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="-1500 -1000 3000 2000" preserveAspectRatio="xMinYMin slice" xmlns="http://www.w3.org/2000/svg"  xmlns:xlink="http://www.w3.org/1999/xlink" >

<defs>

	<g id="a" style="fill:white; stroke:lightgrey">
		<path d="M-150,86.6 L-150,-86.6 L0,0 Z"/>
		<path d="M-90,30 Q -70,55 -150,60" style="stroke:green; stroke-width:5; stroke-linecap:round"/>
		<circle cx="-100" cy="50" r="5" style="fill:red; stroke:none"/>
		<path d="M-140,75 L -150,86.6" style="stroke:purple; stroke-width:5; stroke-linecap:round"/>
		<path d="M-35,0 L0,0" style="stroke:tomato; stroke-width:2; stroke-linecap:round"/>
		<circle cx="-130" cy="20" r="8" style="fill:teal; stroke:none"/>
		<path d="M-100,-40 v30 h20 v-30 z" style="stroke:blue; stroke-width:1; stroke-linecap:round"/>
	</g>

	<g id="b">
		<use xlink:href="#a" />	
		<use xlink:href="#a" transform="rotate(60)"/>
		<use xlink:href="#a" transform="rotate(120)"/>
		<use xlink:href="#a" transform="rotate(180)"/>
		<use xlink:href="#a" transform="rotate(240)"/>
		<use xlink:href="#a" transform="rotate(300)"/>
	</g>
	
	<g id="c">
		<use xlink:href="#b" />
		<use xlink:href="#b" transform="translate(-150,86.6),rotate(120),translate(150,-86.6)" />
		<use xlink:href="#b" transform="translate(-150,86.6),rotate(-120),translate(150,-86.6)" />
	</g>

	<pattern id="tile" patternContentUnits="userSpaceOnUse" patternUnits="userSpaceOnUse" width="300" height="519.6" viewBox="-300 -259.8 300 519.6">
		<use xlink:href="#c" />
		<use xlink:href="#b" transform="translate(0,-173.2),rotate(-120),translate(150,-86.6)" />
	</pattern>
	
</defs>

<rect id="background" x="-1500" y="-1000" width="3000" height="2000" style="fill:url(#tile); stroke:none"/>


