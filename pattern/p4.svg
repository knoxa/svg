<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 2400 1600" preserveAspectRatio="xMinYMin slice" xmlns="http://www.w3.org/2000/svg"  xmlns:xlink="http://www.w3.org/1999/xlink" >

<defs>

	<g id="a" style="fill:white; stroke:lightgrey">
		<path d="M0,0 L-100,0 L-100,100, L0,100 Z"/>
		<path d="M-50,75 L -20,20 h-30" style="stroke:purple; stroke-width:5; stroke-linecap:round"/>
	</g>

	<g id="b">
		<use xlink:href="#a" />
		<use xlink:href="#a" transform="rotate(90)" />
		<use xlink:href="#a" transform="rotate(180)" />
		<use xlink:href="#a" transform="rotate(270)" />
	</g>
	
	<g id="c">
		<use xlink:href="#b" />
		<use xlink:href="#b" transform="translate(100,0),rotate(180),translate(-100,0)"/>
	</g>
	
	<pattern id="tile" patternContentUnits="userSpaceOnUse" patternUnits="userSpaceOnUse" width="400" height="400" viewBox="-100 -300 400 400">
		<use xlink:href="#c" />
		<use xlink:href="#c" transform="translate(100,-100),rotate(180),translate(-100,100)"/>
	</pattern>
	
</defs>

<rect id="background" x="0" y="0" width="2400" height="1600" style="fill:url(#tile); stroke:none"/>

</svg>