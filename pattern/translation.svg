<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="-1500 -1000 3000 2000" preserveAspectRatio="xMinYMin slice" xmlns="http://www.w3.org/2000/svg"  xmlns:xlink="http://www.w3.org/1999/xlink" >

<defs>

	<g id="a" style="fill:none; stroke:grey">
		<path d="M50,50 q 50,0 50,-50"/>
		<path d="M100,0 q 0,-50 -50,-50 h-100"/>
		<path d="M-50,-50 q -50,0 -50,-50 v100 q 0,50 -50,50 h 100 q 50,0 50,50 v-100 q 0,50 50,50"/>
	</g>

	<pattern id="tile" patternContentUnits="userSpaceOnUse" patternUnits="userSpaceOnUse" width="200" height="200" viewBox="-100 -100 200 200">
		<use xlink:href="#a" />
		<use xlink:href="#a" transform="translate(100,100)" />
		<use xlink:href="#a" transform="translate(100,-100)" />
		<use xlink:href="#a" transform="translate(-100,100)" />
		<use xlink:href="#a" transform="translate(-100,-100)" />
	</pattern>
	
</defs>

<rect id="background" x="-1500" y="-1000" width="3000" height="2000" style="fill:url(#tile); stroke:none"/>

</svg>