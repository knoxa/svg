<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="-1500 -1000 3000 2000" preserveAspectRatio="xMinYMin slice" xmlns="http://www.w3.org/2000/svg"  xmlns:xlink="http://www.w3.org/1999/xlink" >

<defs>

	<g id="markers">
		<path d="M0,-86.6 L0,86.6 L150,0 Z" style="fill:none; stroke:lightgrey; opacity:0.5"/>
		<path d="M43.3,0 L150,0 M43.3,0 L0,-86.6 M43.3,0 L0,86.6" style="fill:none; stroke:lightgrey; opacity:0.5"/>
	</g>
	
	<g id="x">
     	<path d="M43,0 h-20 l-23.3,-20" style="stroke:tomato; stroke-width:4; stroke-linecap:round"/>
     	<path d="M0,43.3 l10,-10 l5,5" style="stroke:teal; stroke-width:4; stroke-linecap:round"/>
     	<path d="M0,-43.3 l10,10 l5,-5" style="stroke:teal; stroke-width:4; stroke-linecap:round"/>
     	<circle cx="4" cy="65" r="3" style="stroke:none; fill:tomato"/>
	</g>
	
	<g id="a" style="fill:none">
     	<use xlink:href="#x"/>
    	<use xlink:href="#x" transform="translate(43.3,0),rotate(120),translate(-43.3,0)"/>
     	<use xlink:href="#x" transform="translate(43.3,0),rotate(-120),translate(-43.3,0)"/>
     	<!-- 
     	<use xlink:href="#markers"/>
     	 -->
	</g>
	
	<g id="d">
		<use xlink:href="#a" />
		<use id="b" xlink:href="#a" transform="translate(0,-86.6),rotate(-60),scale(-1,1),rotate(60),translate(0,86.6)"/>
		<use xlink:href="#b" transform="translate(0,-86.6),rotate(60),scale(-1,1),rotate(-60),translate(0,86.6)"/>
		<use id="c" xlink:href="#a" transform="translate(0,86.6),scale(1,-1),rotate(60),translate(0,-86.6)"/>
		<use xlink:href="#c" transform="translate(0,86.6),scale(1,-1),rotate(-60),translate(0,-86.6)"/>
		<use xlink:href="#a" transform="translate(150,-259.8),scale(-1,1)"/>
		<use xlink:href="#c" transform="translate(0,-433),scale(1,-1),rotate(-60),translate(0,-86.6)"/>
	</g>
	
<pattern id="tile" patternContentUnits="userSpaceOnUse" patternUnits="userSpaceOnUse" width="300" height="519.6" viewBox="-150 -346.4 300 519.6">
	<use xlink:href="#d" />
	<use xlink:href="#d" transform="scale(-1,1)"/>
</pattern>
	
</defs>

<rect id="background" x="-1500" y="-1000" width="3000" height="2000" style="fill:url(#tile); stroke:none"/>

</svg>