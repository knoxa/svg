<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="-1500 -1000 3000 2000" preserveAspectRatio="xMinYMin slice" xmlns="http://www.w3.org/2000/svg"  xmlns:xlink="http://www.w3.org/1999/xlink" >

<defs>

	<g id="a" style="fill:white; stroke:lightgrey">
		<path d="M0,-86.6 L0,86.6 L150,0 Z"/>
     	<path d="M120,-17.2 Q40,0 45,60.6" style="stroke:tomato; stroke-width:4; stroke-linecap:round"/>
     	<path d="M0,-75 Q20,-80 15,-78" style="stroke:teal; stroke-width:2; stroke-linecap:round"/>

		<path d="M0,-86.6 L0,86.6 L-150,0 Z" style="fill:white; stroke:lightgrey"/>
     	<path d="M-120,-17.2 Q0,0 -45,60.6" style="stroke:green; stroke-width:4; stroke-linecap:round"/>
	</g>

	<g id="b">
		<use xlink:href="#a" />	
		<use xlink:href="#a" transform="translate(0,-86.6),rotate(120),translate(0,86.6)"/>
		<use xlink:href="#a" transform="translate(0,-86.6),rotate(240),translate(0,86.6)"/>
	</g>
	
	<pattern id="tile" patternContentUnits="userSpaceOnUse" patternUnits="userSpaceOnUse" width="600" height="519.6" viewBox="-300 -346.4 600 519.6">
		<use xlink:href="#b" />
		<use xlink:href="#b" transform="translate(0,-258.8),rotate(120),translate(0,258.8)"/>
		<use xlink:href="#b" transform="translate(0,-258.8),rotate(240),translate(0,258.8)"/>
		<use xlink:href="#b" transform="translate(0,86.6),rotate(120),translate(0,-86.6)"/>
		<use xlink:href="#b" transform="translate(0,86.6),rotate(240),translate(0,-86.6)"/>
		<use xlink:href="#b" transform="translate(-150,0),rotate(120),translate(150,0)"/>
		<use xlink:href="#b" transform="translate(-150,0),rotate(240),translate(150,0)"/>
		<use xlink:href="#b" transform="translate(150,0),rotate(120),translate(-150,0)"/>
	</pattern>
	
</defs>

<rect id="background" x="-1500" y="-1000" width="3000" height="2000" style="fill:url(#tile); stroke:none"/>

<circle cx="0" cy="0" r="10"/>

</svg>