<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="-1500 -1000 3000 2000" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"  xmlns:xlink="http://www.w3.org/1999/xlink" >

<defs>

	<g id="markers">
		<path d="M0,0 L-100,0 L-100,50, L0,50 Z" style="fill:none; stroke:lightgrey; opacity:0.5"/>
	</g>

	<g id="a" style="fill:white; stroke:lightgrey">
		<path d="M0,0 L-200,0 L-200,100, L0,100 Z"/>
		<path d="M-50,75 L -20,20 h-30" style="stroke:purple; stroke-width:5; stroke-linecap:round"/>
		<path d="M-150,75 l10,-60" style="stroke:teal; stroke-width:5; stroke-linecap:round"/>
	</g>


	<g id="b">
		<use xlink:href="#a"/>
		<use xlink:href="#a" transform="translate(100,50),scale(1,-1),translate(100,-50)"/>
	</g>
	
	<g id="c">
		<use xlink:href="#b"/>
		<use xlink:href="#a" transform="translate(400,0)"/>
	</g>
	
	<pattern id="tile" patternContentUnits="userSpaceOnUse" patternUnits="userSpaceOnUse" width="400" height="200" viewBox="-150 -100 400 200">
		<use xlink:href="#c"/>
		<use xlink:href="#c" transform="translate(100,100),scale(-1,1)"/>
		<use xlink:href="#c" transform="translate(100,-100),scale(-1,1)"/>
	</pattern>
	
</defs>

<rect id="background" x="-1500" y="-1000" width="3000" height="2000" style="fill:url(#tile); stroke:none"/>

</svg>