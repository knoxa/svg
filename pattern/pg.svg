<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="-1500 -1000 3000 2000" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"  xmlns:xlink="http://www.w3.org/1999/xlink" >

<defs>

	<g id="markers">
		<path d="M0,0 L-200,0 L-200,100, L0,100 Z" style="fill:none; stroke:lightgrey; opacity:0.5"/>
	</g>

	<g id="a" style="fill:white; stroke:lightgrey">
		<path d="M-150,0 l50,50 l-50,50" style="stroke:teal; stroke-width:5"/>
		<path d="M0,0 l-50,50 v30 h-70 l20,20" style="stroke:teal; stroke-width:5"/>
		<use xlink:href="#markers"/>
	</g>


	<g id="b">
		<use xlink:href="#a" transform="translate(-100,-100),scale(-1,1)"/>
		<use xlink:href="#a" transform="translate(-200,-100),scale(-1,1),translate(100,0)"/>
	</g>
	
	<pattern id="tile" patternContentUnits="userSpaceOnUse" patternUnits="userSpaceOnUse" width="400" height="200" viewBox="-150 0 400 200">
		<use xlink:href="#a"/>
		<use xlink:href="#b"/>
		<use xlink:href="#a" transform="translate(200,0)"/>
		<use xlink:href="#a" transform="translate(-200,0)"/>
		<use xlink:href="#b" transform="translate(0,200)"/>
		<use xlink:href="#b" transform="translate(400,200)"/>
	</pattern>
	
</defs>

<rect id="background" x="-1500" y="-1000" width="3000" height="2000" style="fill:url(#tile); stroke:none"/>

</svg>