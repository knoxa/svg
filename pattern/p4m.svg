<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="-1500 -1000 3000 2000" preserveAspectRatio="xMinYMin slice" xmlns="http://www.w3.org/2000/svg"  xmlns:xlink="http://www.w3.org/1999/xlink" >

<defs>

	<g id="a" style="fill:white; stroke:lightgrey">
		<path d="M0,150 L0,0 L150,0 Z"/>
		<path d="M75,40,h-30 L0,0 M75,0 v10" style="stroke:tomato; stroke-width:2; stroke-linecap:round"/>
     	<circle cx="50" cy="60" r="5" style="fill:teal; stroke:none"/>
	</g>

	<g id="b">
		<use xlink:href="#a"/>
		<use xlink:href="#a" transform="translate(0,150),rotate(-45),scale(1,-1),rotate(45),translate(0,-150)"/>
	</g>
	
	<g id="c">
		<use xlink:href="#b"/>
		<use xlink:href="#b" transform="scale(-1,1)"/>
	</g>
	
	<g id="d">
		<use xlink:href="#c"/>
		<use xlink:href="#c" transform="scale(1,-1)"/>
	</g>

	<pattern id="tile" patternContentUnits="userSpaceOnUse" patternUnits="userSpaceOnUse" width="300" height="300">
	
	<g transform="translate(150,150)">
		<use xlink:href="#d"/>
	</g>
	</pattern>
	
</defs>

<rect id="background" x="-1200" y="-900" width="2400" height="1800" style="fill:url(#tile); stroke:none"/>


<circle cx="0" cy="0" r="10"/>
</svg>