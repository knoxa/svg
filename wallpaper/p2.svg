<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="-1500 -1000 3000 2000" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"  xmlns:xlink="http://www.w3.org/1999/xlink" >

<defs>

	<g id="markers">
		<path d="M0,0 L-200,0 L-200,100, L0,100 Z" style="fill:none; stroke:light-grey; opacity:0.5"/>
	</g>

	<g id="a" style="fill:white; stroke:lightgrey">
		<path d="M-50,75 L -20,20 h-30 L-100,0" style="stroke:none; fill:purple"/>
		<path d="M-200,100 l50,-25 l10,-60 L-50,75 Z" style="stroke:none; fill:teal"/>
		<circle cx="-175" cy="25" r="8" style="stroke:none; fill:teal"/>
		<!-- 
		<use xlink:href="#markers" />
		 -->
	</g>
	
<pattern id="tile" patternContentUnits="userSpaceOnUse" patternUnits="userSpaceOnUse" width="200" height="200" viewBox="-200 -100 200 200">
	<use xlink:href="#a" />
	<use xlink:href="#a" transform="rotate(180)"/>
	<use xlink:href="#a" transform="translate(0,100), rotate(180), translate(0,-100)"/>
	<use xlink:href="#a" transform="translate(-100,0), rotate(180), translate(100,0)"/>
	<use xlink:href="#a" transform="translate(-100,100), rotate(180), translate(100,-100)"/>
</pattern>
	
</defs>

<rect id="background" x="-1500" y="-1000" width="3000" height="2000" style="fill:url(#tile); stroke:none"/>

</svg>