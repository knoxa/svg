<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="-1500 -1000 3000 2000" preserveAspectRatio="xMinYMin slice" xmlns="http://www.w3.org/2000/svg"  xmlns:xlink="http://www.w3.org/1999/xlink" >

<defs>

	<g id="markers">
		<path d="M-50,0 L50,0 L50,50 L-50,50 Z" style="stroke:lightgrey; opacity:0.5"/>
	</g>

	<g id="a" style="fill:none">
     	<path d="M-35,0 l35,35 h35 v-35" style="stroke:tomato; stroke-width:5; stroke-linecap:round"/>
     	<path d="M-50,50 l20,-20" style="stroke:teal; stroke-width:5; stroke-linecap:round"/>
     	<use xlink:href="#markers"/>
	</g>
	
	<g id="b">
		<use xlink:href="#a"/>
		<use xlink:href="#a" transform="rotate(180)"/>
	</g>
	
	<g id="c">
		<use xlink:href="#b"/>
		<use xlink:href="#b" transform="translate(0,-50),scale(1,-1),translate(0,50)"/>
	</g>
	
	<pattern id="tile" patternContentUnits="userSpaceOnUse" patternUnits="userSpaceOnUse" width="200" height="200" viewBox="-50 -150 200 200">
		<use xlink:href="#c"/>
		<use xlink:href="#c" transform="translate(50,0),scale(-1,1),translate(-50,0)"/>
	</pattern>
	
</defs>

<rect id="background" x="-1500" y="-1000" width="3000" height="2000" style="fill:url(#tile); stroke:none"/>

</svg>