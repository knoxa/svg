<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="-1500 -1000 3000 2000" preserveAspectRatio="xMinYMin slice" width="100%" xmlns="http://www.w3.org/2000/svg"  xmlns:xlink="http://www.w3.org/1999/xlink" >

<defs>

  <g id="a" style="fill:white; stroke:lightgrey">
     <path d="M-150,0 L-150,86.6 L0,0 Z"/>
     <path d="M-75,0 Q -50,30 -15,8.66" style="stroke:blue; stroke-width:5; stroke-linecap:round"/>
     <path d="M-90,30 Q -70,70 -150,60" style="stroke:green; stroke-width:5; stroke-linecap:round"/>
     <circle cx="-100" cy="50" r="5" style="fill:red; stroke:none"/>
     <path d="M-150,75 L -150,86.6" style="stroke:purple; stroke-width:5; stroke-linecap:round"/>
     <path d="M-15,0 L0,0" style="stroke:tomato; stroke-width:2; stroke-linecap:round"/>
     <circle cx="-130" cy="20" r="5" style="fill:teal; stroke:none"/>
  </g>

<g id="t1">
	<use xlink:href="#a"/>
	
	<g id="b">
		<use xlink:href="#a" transform="rotate(60),scale(-1,1),rotate(-60)" />
	</g>
	
	<g id="c">
		<use xlink:href="#b" transform="rotate(30),scale(-1,1),rotate(-30)" />
	</g>
	
	<g id="d">
		<use xlink:href="#b" transform="translate(0,173.2),rotate(-60),scale(-1,1),rotate(60),translate(0,-173.2)" />
	</g>
	
	<g id="e">
		<use xlink:href="#c" transform="translate(0,173.2),rotate(-60),scale(-1,1),rotate(60),translate(0,-173.2)" />
	</g>
	
	<g id="f">
		<use xlink:href="#e" transform="translate(0,173.2),scale(1,-1),rotate(60),translate(0,-173.2)"/>
	</g>
</g>

<pattern id="tile" patternContentUnits="userSpaceOnUse" patternUnits="userSpaceOnUse" width="300" height="519.6">

<g transform="translate(150,259.8)">
	<g id="t2">
		<use xlink:href="#t1"/>
		<use xlink:href="#t1" transform="scale(-1,1)"/>
	</g>
	
	<g id="t3">
		<use xlink:href="#t2" transform="scale(1,-1)"/>
	</g>
</g>
</pattern>

</defs>

<rect id="background" x="-1500" y="-1000" width="3000" height="2000" style="fill:url(#tile); stroke:none"/>

<use xlink:href="#tile"/>

<!-- 
